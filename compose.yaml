services:
  telegram:
    build:
      context: .
      dockerfile: deploy/docker/telegram.Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?Set TELEGRAM_ALLOWED_USER_IDS in .env}
      AGENT_URL: http://agent:8080
      AGENT_API_TOKEN_FILE: /run/secrets/agent_api_token
    secrets:
      - agent_api_token
    volumes:
      - telegram_data:/home/telegram/data
    depends_on:
      agent:
        condition: service_healthy
    init: true
    read_only: true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  agent:
    build:
      context: .
      dockerfile: deploy/docker/agent.Dockerfile
    environment:
      CODEX_MODEL: ${CODEX_MODEL:-gpt-6-astra}
      CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-medium}
      CODEX_AUTO_COMPACT_PERCENT: ${CODEX_AUTO_COMPACT_PERCENT:-}
      AGENT_API_TOKEN_FILE: /run/secrets/agent_api_token
      PROFILE_SERVICE_URL: http://mcp:8080
      PROFILE_SIGNING_KEY_FILE: /run/secrets/profile_signing_key
    secrets:
      - agent_api_token
      - profile_signing_key
    depends_on:
      mcp:
        condition: service_healthy
    networks:
      - default
      - profiles
    init: true
    read_only: true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128
    volumes:
      - codex_data:/home/agent/.codex
      - ${AGENT_INSTRUCTIONS_DIR:-./config/agent}:/app/config/agent:ro
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  mcp:
    build:
      context: .
      dockerfile: deploy/docker/mcp.Dockerfile
    environment:
      PROFILE_SIGNING_KEY_FILE: /run/secrets/profile_signing_key
    secrets:
      - profile_signing_key
    networks:
      - profiles
    volumes:
      - profile_data:/home/mcp/data
      - ${AGENT_INSTRUCTIONS_DIR:-./config/agent}:/app/config/agent:ro
    init: true
    read_only: true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  codex_data:
  telegram_data:
  profile_data:

secrets:
  agent_api_token:
    file: ${AGENT_API_TOKEN_PATH:-./credentials/agent_api_token}
  profile_signing_key:
    file: ${PROFILE_SIGNING_KEY_PATH:-./credentials/profile_signing_key}

networks:
  profiles:
    internal: true
    ipam:
      config:
        - subnet: ${TASKOPOTAMUS_PROFILE_SUBNET:-10.203.17.16/28}
  default:
    ipam:
      config:
        - subnet: ${TASKOPOTAMUS_SUBNET:-10.203.17.0/28}
