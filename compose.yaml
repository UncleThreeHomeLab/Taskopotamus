x-security: &security
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

x-database: &database
  DATABASE_HOST: postgres
  DATABASE_PORT: "5432"
  DATABASE_SSLMODE: disable
  DATABASE_PASSWORD_FILE: /run/secrets/database_password

services:
  storage-init:
    <<: *security
    image: python:3.13-slim
    user: "0:0"
    network_mode: none
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    working_dir: /app
    command: [python, -m, src.storage.prepare, --data-dir, /storage, --credentials-dir, /credentials, --container]
    volumes:
      - ${DATA_DIR:-./storage}:/storage
      - ./src:/app/src:ro
      - ${CREDENTIALS_DIR:-./credentials}:/credentials
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 16

  postgres:
    <<: *security
    image: postgres:18.6
    user: "999:999"
    group_add: ["10001"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      PGDATA: /var/lib/postgresql/18/docker
    command: [postgres, -c, log_error_verbosity=terse, -c, log_min_error_statement=panic]
    secrets: [postgres_admin_password, agent_database_password, profile_database_password, telegram_database_password]
    volumes:
      - ${DATA_DIR:-./storage}/postgres:/var/lib/postgresql
      - ./deploy/postgres/initialize_databases.sh:/docker-entrypoint-initdb.d/initialize_databases.sh:ro
    tmpfs:
      - /tmp:mode=1777
      - /var/run/postgresql:uid=999,gid=999,mode=3770
    networks: [database]
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, postgres]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  objects:
    <<: *security
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z
    user: "10001:10001"
    environment:
      MINIO_ROOT_USER: taskopotamus-admin
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/silo_root_password
      MINIO_BROWSER: "off"
      MINIO_UPDATE: "off"
    command: [server, /data, --console-address, "127.0.0.1:9001"]
    secrets: [silo_root_password]
    volumes:
      - ${DATA_DIR:-./storage}/objects:/data
    tmpfs:
      - /tmp:mode=1777
    networks: [objects]
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, --output, /dev/null, http://localhost:9000/minio/health/live]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128

  telegram:
    <<: *security
    build:
      context: .
      dockerfile: deploy/docker/telegram.Dockerfile
    environment:
      <<: *database
      DATABASE_NAME: taskopotamus_telegram
      DATABASE_USER: taskopotamus_telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      AGENT_URL: http://agent:8080
      AGENT_API_TOKEN_FILE: /run/secrets/agent_api_token
      CODEX_TURN_TIMEOUT_SECONDS: ${CODEX_TURN_TIMEOUT_SECONDS:-600}
      GOOGLE_SERVICE_URL: http://google:8081
      GOOGLE_CONTROL_SECRET_FILE: /run/secrets/google_control_secret
    secrets:
      - agent_api_token
      - google_control_secret
      - source: telegram_database_password
        target: database_password
    networks: [default, database, google_control]
    tmpfs:
      - /tmp:mode=1777,size=32m
    depends_on:
      google:
        condition: service_healthy
      agent:
        condition: service_healthy
      postgres:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  google:
    <<: *security
    build:
      context: .
      dockerfile: deploy/docker/google.Dockerfile
    environment:
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      GOOGLE_CONTROL_SECRET_FILE: /run/secrets/google_control_secret
      GOOGLE_TOKEN_ENCRYPTION_KEY_FILE: /run/secrets/google_token_encryption_key
      GOOGLE_DATA_SECRET_FILE: /run/secrets/google_data_secret
      GOOGLE_STORAGE_DIRECTORY: /var/lib/taskopotamus/google
    secrets: [google_control_secret, google_token_encryption_key, google_data_secret]
    volumes:
      - ${DATA_DIR:-./storage}/google:/var/lib/taskopotamus/google
    ports:
      - "${GOOGLE_CALLBACK_BIND_IP:-127.0.0.1}:${GOOGLE_CALLBACK_PORT:-8090}:8080"
    networks: [google_control, google_egress, google_data]
    tmpfs:
      - /tmp:mode=1777,size=16m
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8081/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 32

  test-console:
    <<: *security
    profiles: [manual-test]
    build:
      context: .
      dockerfile: deploy/docker/agent.Dockerfile
    command: [python, -m, src.test_console.server]
    environment:
      AGENT_URL: http://agent:8080
      AGENT_API_TOKEN_FILE: /run/secrets/agent_api_token
      CODEX_TURN_TIMEOUT_SECONDS: ${CODEX_TURN_TIMEOUT_SECONDS:-600}
    secrets: [agent_api_token]
    networks: [execution, console_ingress]
    ports: ["127.0.0.1:8088:8088"]
    tmpfs:
      - /tmp:mode=1777,size=32m
    depends_on:
      agent:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  agent:
    <<: *security
    build:
      context: .
      dockerfile: deploy/docker/agent.Dockerfile
    environment:
      <<: *database
      DATABASE_NAME: taskopotamus_agent
      DATABASE_USER: taskopotamus_agent
      CODEX_MODEL: ${CODEX_MODEL:-gpt-6-astra}
      CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-medium}
      CODEX_AUTO_COMPACT_PERCENT: ${CODEX_AUTO_COMPACT_PERCENT:-}
      CODEX_SUBAGENT_MODEL: ${CODEX_SUBAGENT_MODEL:-gpt-6-luna}
      CODEX_SUBAGENT_REASONING_EFFORT: ${CODEX_SUBAGENT_REASONING_EFFORT:-high}
      CODEX_SUBAGENT_MAX_THREADS: ${CODEX_SUBAGENT_MAX_THREADS:-2}
      CODEX_TURN_TIMEOUT_SECONDS: ${CODEX_TURN_TIMEOUT_SECONDS:-600}
      CODEX_BIN: /usr/local/bin/codex-worker
      WORKER_CLIENT_KEY_FILE: /run/secrets/worker_client_key
      WORKER_HOST_PUBLIC_KEY_FILE: /run/secrets/worker_host_public
      AGENT_API_TOKEN_FILE: /run/secrets/agent_api_token
      PROFILE_SERVICE_URL: http://mcp:8080
      GOOGLE_DATA_SECRET_FILE: /run/secrets/google_data_secret
      PROFILE_SIGNING_KEY_FILE: /run/secrets/profile_signing_key
      ARTIFACT_DIRECTORY: /var/lib/taskopotamus/artifacts
      ARTIFACT_MAX_FILES: ${ARTIFACT_MAX_FILES:-10}
      ARTIFACT_INPUT_MAX_BYTES: ${ARTIFACT_INPUT_MAX_BYTES:-20000000}
      ARTIFACT_OUTPUT_MAX_BYTES: ${ARTIFACT_OUTPUT_MAX_BYTES:-50000000}
      ARTIFACT_IMAGE_MAX_BYTES: ${ARTIFACT_IMAGE_MAX_BYTES:-10000000}
      ARTIFACT_CAPACITY_BYTES: ${ARTIFACT_CAPACITY_BYTES:-1073741824}
      ARTIFACT_STAGING_SECONDS: ${ARTIFACT_STAGING_SECONDS:-3600}
      ARTIFACT_RETENTION_SECONDS: ${ARTIFACT_RETENTION_SECONDS:-604800}
      ARTIFACT_SWEEP_SECONDS: ${ARTIFACT_SWEEP_SECONDS:-60}
    secrets:
      - agent_api_token
      - profile_signing_key
      - google_data_secret
      - source: agent_database_password
        target: database_password
      - worker_client_key
      - worker_host_public
    depends_on:
      mcp:
        condition: service_healthy
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
    networks:
      execution:
        ipv4_address: ${WORKER_AGENT_IP:-10.203.17.30}
      database:
      google_data:
    volumes:
      - ${AGENT_INSTRUCTIONS_DIR:-./config/agent}:/app/config/agent:ro
      - ${DATA_DIR:-./storage}/artifacts:/var/lib/taskopotamus/artifacts
    tmpfs:
      - /tmp:mode=1777
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 128

  mcp:
    <<: *security
    build:
      context: .
      dockerfile: deploy/docker/mcp.Dockerfile
    environment:
      <<: *database
      DATABASE_NAME: taskopotamus_profiles
      DATABASE_USER: taskopotamus_profiles
      PROFILE_SIGNING_KEY_FILE: /run/secrets/profile_signing_key
    secrets:
      - profile_signing_key
      - source: profile_database_password
        target: database_password
    networks:
      database:
      execution:
        ipv4_address: ${WORKER_MCP_IP:-10.203.17.18}
    volumes:
      - ${AGENT_INSTRUCTIONS_DIR:-./config/agent}:/app/config/agent:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 10
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64

  worker:
    <<: *security
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    user: "0:0"
    group_add: ["10001"]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SYS_CHROOT, SETPCAP, NET_ADMIN, KILL]
    environment:
      WORKER_MCP_IP: ${WORKER_MCP_IP:-10.203.17.18}
      WORKER_AGENT_IP: ${WORKER_AGENT_IP:-10.203.17.30}
      WORKER_DNS_IP: ${WORKER_DNS_IP:-1.1.1.1}
      WORKSPACE_RETENTION_SECONDS: ${WORKSPACE_RETENTION_SECONDS:-604800}
      WORKSPACE_SWEEP_SECONDS: ${WORKSPACE_SWEEP_SECONDS:-3600}
      WORKSPACE_MAX_BYTES: ${WORKSPACE_MAX_BYTES:-1073741824}
    dns: ["${WORKER_DNS_IP:-1.1.1.1}"]
    secrets: [worker_host_key, worker_client_public]
    networks: [execution, default]
    volumes:
      # Native session metadata stores absolute paths; preserve the original Codex home.
      - worker_codex:/home/agent/.codex
      # Preserve pre-retention files without silently expiring them.
      - worker_workspace:/legacy-workspace:ro
      - worker_scratch:/workspace
      - worker_saved:/saved
      - worker_state:/var/lib/taskopotamus
    tmpfs:
      - /tmp:mode=0700
      - /run:mode=0700
      - /root:mode=0700
      - /home/agent:mode=0700
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    depends_on:
      mcp:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "test -s /run/sshd/sshd.pid && /usr/sbin/sshd -t -f /etc/ssh/taskopotamus_config"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256

volumes:
  worker_codex:
  worker_workspace:
  worker_scratch:
  worker_saved:
  worker_state:

secrets:
  google_data_secret:
    file: ${CREDENTIALS_DIR:-./credentials}/google_data_secret
  google_control_secret:
    file: ${CREDENTIALS_DIR:-./credentials}/google_control_secret
  google_token_encryption_key:
    file: ${CREDENTIALS_DIR:-./credentials}/google_token_encryption_key
  agent_api_token:
    file: ${AGENT_API_TOKEN_PATH:-${CREDENTIALS_DIR:-./credentials}/agent_api_token}
  profile_signing_key:
    file: ${PROFILE_SIGNING_KEY_PATH:-${CREDENTIALS_DIR:-./credentials}/profile_signing_key}
  postgres_admin_password:
    file: ${POSTGRES_ADMIN_PASSWORD_PATH:-${CREDENTIALS_DIR:-./credentials}/postgres_admin_password}
  agent_database_password:
    file: ${AGENT_DATABASE_PASSWORD_PATH:-${CREDENTIALS_DIR:-./credentials}/agent_database_password}
  profile_database_password:
    file: ${PROFILE_DATABASE_PASSWORD_PATH:-${CREDENTIALS_DIR:-./credentials}/profile_database_password}
  telegram_database_password:
    file: ${TELEGRAM_DATABASE_PASSWORD_PATH:-${CREDENTIALS_DIR:-./credentials}/telegram_database_password}
  silo_root_password:
    file: ${SILO_ROOT_PASSWORD_PATH:-${CREDENTIALS_DIR:-./credentials}/silo_root_password}
  worker_client_key:
    file: ${CREDENTIALS_DIR:-./credentials}/worker_client_key
  worker_host_public:
    file: ${CREDENTIALS_DIR:-./credentials}/worker_host_key.pub
  worker_host_key:
    file: ${CREDENTIALS_DIR:-./credentials}/worker_host_key
  worker_client_public:
    file: ${CREDENTIALS_DIR:-./credentials}/worker_client_key.pub

networks:
  google_data:
    internal: true
  google_control:
    internal: true
  google_egress:
  console_ingress:
    ipam:
      config:
        - subnet: ${TASKOPOTAMUS_CONSOLE_SUBNET:-10.203.17.64/28}
  execution:
    internal: true
    ipam:
      config:
        - subnet: ${TASKOPOTAMUS_EXECUTION_SUBNET:-10.203.17.16/28}
  database:
    internal: true
    ipam:
      config:
        - subnet: ${TASKOPOTAMUS_DATABASE_SUBNET:-10.203.17.32/28}
  objects:
    internal: true
    ipam:
      config:
        - subnet: ${TASKOPOTAMUS_OBJECT_SUBNET:-10.203.17.48/28}
  default:
    ipam:
      config:
        - subnet: ${TASKOPOTAMUS_SUBNET:-10.203.17.0/28}
