{{- if .Values.ambient.enabled }}
{{- range $component := include "taskopotamus.components" . | fromJsonArray }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ printf "%s-%s" $.Release.Name $component | quote }}
  labels:
    {{- include "taskopotamus.labels" (dict "root" $ "component" $component) | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
