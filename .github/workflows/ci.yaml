name: CI
"on":
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read, pull-requests: read}
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: cloudlab-taskopotamus
    timeout-minutes: 20
    permissions: {contents: read, pull-requests: read}
    steps:
      - name: Check out the eligible application revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Run offline tests from the checked-out source
        shell: bash
        run: cloudlab-test --source . -- sh deploy/testing/run_tests.sh
  publish:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: cloudlab-taskopotamus-publish
    timeout-minutes: 25
    permissions: {contents: read, pull-requests: read, id-token: write}
    steps:
      - name: Check out the reviewed publishing implementation
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: UncleThreeHomeLab/yasai-cloudlab
          ref: ca724b54fa877a2eba8109065df7e7b7df253f90
          path: platform
          persist-credentials: false
      - name: Check out the tested application revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: application
          persist-credentials: false
      - name: Build scan sign and propose the component release
        shell: bash
        run: python3 -I -S platform/ansible/playbooks/ci/files/publisher.py
