name: CI
"on":
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read, pull-requests: read}
concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: cloudlab-taskopotamus
    timeout-minutes: 20
    permissions: {contents: read, pull-requests: read}
    steps:
      - name: Check out the eligible application revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Run offline tests from the checked-out source
        shell: bash
        run: cloudlab-test --source . -- sh deploy/testing/run_tests.sh
  build:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: cloudlab-taskopotamus
    timeout-minutes: 25
    permissions: {contents: read, pull-requests: read}
    steps:
      - name: Check out the tested application revision
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Build application images into temporary OCI archives
        shell: bash
        run: |
          set -euo pipefail
          image_output="$RUNNER_TEMP/taskopotamus-images"
          mkdir -p "$image_output"
          for component in agent mcp google telegram worker; do
            buildctl --addr tcp://127.0.0.1:1234 build \
              --frontend dockerfile.v0 \
              --local context=. --local dockerfile=. \
              --opt "filename=deploy/docker/$component.Dockerfile" \
              --opt platform=linux/amd64 \
              --output "type=oci,dest=$image_output/$component.tar"
            # This job owns its disposable builder; release native snapshots between images.
            buildctl --addr tcp://127.0.0.1:1234 prune --all
          done
